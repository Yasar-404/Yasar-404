<svg xmlns="http://www.w3.org/2000/svg" width="960" height="40" viewBox="0 0 960 40" fill="none" role="img" aria-label="Section divider"><title>Section divider</title><defs><style>.ink{fill:#16161A}.muted{fill:#5F5F6A}.faint{fill:#85858F}.accent{fill:#4A63E8}.mintf{fill:#0E9E80}.rule{stroke:#E0E0E6;stroke-width:1}.card{fill:#F3F3F7;stroke:#E0E0E6;stroke-width:1}.tick{animation:tick 7s cubic-bezier(.4,0,.2,1) infinite}@keyframes tick{0%{transform:translateX(0);opacity:0}8%,92%{opacity:1}100%{transform:translateX(864px);opacity:0}}@media(prefers-reduced-motion:reduce){.tick{animation:none;opacity:0}}</style></defs><line class="rule" x1="48" y1="20" x2="912" y2="20"/><circle class="tick" cx="48" cy="20" r="2.5" fill="#4A63E8"/></svg>
